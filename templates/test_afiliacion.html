<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧪 TEST Afiliación - Claude Dev</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/afiliacion.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="afiliacion-container">
        <h1>🧪 TEST CLAUDE DEV - FORMULARIO AFILIACIÓN</h1>
        
        <div class="medical-alert medical-alert--info">
            <i class="fas fa-info-circle"></i>
            <div>
                <strong>Testing:</strong> Verificando si CSS y JavaScript cargan correctamente
            </div>
        </div>
        
        <button class="medical-btn medical-btn--primary" onclick="testFunction()">
            <i class="fas fa-play"></i>
            TEST JAVASCRIPT
        </button>
        
        <button class="medical-btn medical-btn--success" onclick="testCSS()">
            <i class="fas fa-palette"></i>
            TEST CSS
        </button>
        
        <div id="test-results"></div>
    </div>

    <script>
        function testFunction() {
            alert('✅ JavaScript funciona!');
            document.getElementById('test-results').innerHTML = '<p style="color: green;">✅ JavaScript: OK</p>';
        }
        
        function testCSS() {
            const container = document.querySelector('.afiliacion-container');
            const style = window.getComputedStyle(container);
            const bgColor = style.backgroundColor;
            
            document.getElementById('test-results').innerHTML += `<p style="color: blue;">🎨 CSS Background: ${bgColor}</p>`;
            
            if (bgColor && bgColor !== 'rgba(0, 0, 0, 0)') {
                document.getElementById('test-results').innerHTML += '<p style="color: green;">✅ CSS: CARGADO</p>';
            } else {
                document.getElementById('test-results').innerHTML += '<p style="color: red;">❌ CSS: NO CARGADO</p>';
            }
        }
        
        // Auto test al cargar
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🧪 Página de test cargada');
            setTimeout(() => {
                testCSS();
            }, 1000);
        });
    </script>
</body>
</html>
